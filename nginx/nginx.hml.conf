# nginx.hml.conf — Proxy reverso para homologação (market_suite)
#
# Substituir os placeholders antes de usar na VPS:
#   app-hml.seudominio.com  → domínio do frontend
#   api-hml.seudominio.com  → domínio da API
#
# Certificados TLS (self-signed para HML):
#   openssl req -x509 -newkey rsa:4096 -days 365 -nodes \
#     -keyout /etc/nginx/certs/hml.key \
#     -out    /etc/nginx/certs/hml.crt \
#     -subj "/CN=hml.seudominio.com"
#
# Colocar em: ./certs/ (na VPS, não versionado)

# Resolver DNS da rede interna Docker — permite que o Nginx resolva nomes de
# serviço mesmo que um container ainda não tenha subido no momento do start.
resolver 127.0.0.11 valid=10s;

# Gzip compression
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;


# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name app.marketalert.com.br api.marketalert.com.br;

    location / {
    return 301 https://$host$request_uri;
    }
}

# API — market_alert
server {
    listen 443 ssl;
    http2 on;
    server_name api.marketalert.com.br;

    ssl_certificate     /etc/nginx/certs/hml.crt;
    ssl_certificate_key /etc/nginx/certs/hml.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS (força HTTPS em requisições futuras)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Log
    access_log /var/log/nginx/api.access.log combined;
    error_log /var/log/nginx/api.error.log warn;

    # Healthcheck endpoint
    location /health {
        access_log off;
        proxy_pass         http://market_alert:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host localhost;
        proxy_read_timeout 5s;
    }

    # Proxy para API
    location / {
        proxy_pass         http://market_alert:8000;
        proxy_http_version 1.1;

        # Headers de requisição
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $server_name;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Upgrade           $http_upgrade;

        # Timeouts compatíveis com operações longas (scraping)
        proxy_connect_timeout 30s;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;

        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# Frontend (estático via `serve`)
server {
    listen 443 ssl;
    http2 on;
    server_name app.marketalert.com.br;

    # Certificados TLS (mesmo certificado da API ou wildcard)
    ssl_certificate     /etc/nginx/certs/hml.crt;
    ssl_certificate_key /etc/nginx/certs/hml.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cabeçalhos de segurança
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    # Log
    access_log /var/log/nginx/app.access.log combined;
    error_log /var/log/nginx/app.error.log warn;

    # Proxy para frontend
    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;

        # Headers de requisição
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Upgrade           $http_upgrade;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
