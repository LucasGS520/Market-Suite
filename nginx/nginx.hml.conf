# nginx.hml.conf — Proxy reverso para homologação (market_suite)
#
# Substituir os placeholders antes de usar na VPS:
#   app-hml.seudominio.com  → domínio do frontend
#   api-hml.seudominio.com  → domínio da API
#
# Certificados TLS (self-signed para HML):
#   openssl req -x509 -newkey rsa:4096 -days 365 -nodes \
#     -keyout /etc/nginx/certs/hml.key \
#     -out    /etc/nginx/certs/hml.crt \
#     -subj "/CN=hml.seudominio.com"
#
# Colocar em: ./certs/ (na VPS, não versionado)

# Resolver DNS da rede interna Docker — permite que o Nginx resolva nomes de
# serviço mesmo que um container ainda não tenha subido no momento do start.
resolver 127.0.0.11 valid=10s;

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name app-hml.seudominio.com api-hml.seudominio.com;
    return 301 https://$host$request_uri;
}

# API — market_alert
server {
    listen 443 ssl http2;
    server_name api-hml.seudominio.com;

    ssl_certificate     /etc/nginx/certs/hml.crt;
    ssl_certificate_key /etc/nginx/certs/hml.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeçalhos de segurança básicos
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    location / {
        proxy_pass         http://market_alert:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts compatíveis com operações longas (scraping)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
    }
}

# Frontend (estático via `serve`)
server {
    listen 443 ssl http2;
    server_name app-hml.seudominio.com;

    ssl_certificate     /etc/nginx/certs/hml.crt;
    ssl_certificate_key /etc/nginx/certs/hml.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    location / {
        proxy_pass         http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
