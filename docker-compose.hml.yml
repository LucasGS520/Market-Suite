# docker-compose.hml.yml — Compose de Homologação (market_suite)
#
# Comandos oficiais de homologação:
#   1. Carregar ambiente: `bash scripts/load_env.sh staging`
#   2. Validar segredos: `bash scripts/check_secrets_hml.sh`
#   3. Subir stack: `docker compose -f docker-compose.hml.yml up -d`
#   4. Prod: reservado para definição futura, sem compose oficial neste repositório
#
# Características operacionais de homologação:
#   - Usa somente imagens prontas (image:) — sem build local neste arquivo.
#   - Sem bind mounts de código-fonte; apenas volumes nomeados de dados.
#   - Sem profiles — todos os serviços sobem juntos.
#   - Portas de serviços internos não são publicadas no host.
#   - Exposição externa ocorre apenas pelo Nginx.
#
# Pré-requisitos na VPS:
#   1. Garantir que as imagens já estejam disponíveis no host
#      (via registry, docker pull ou docker load).
#   2. Preencher os templates `.env.common.staging`, `.env.temporal.staging`,
#      `backend/market_alert/.env.market_alert.staging`,
#      `backend/market_orchestrator/.env.market_orchestrator.staging`,
#      `backend/market_scraper/.env.market_scraper.staging`
#      e `frontend/.env.frontend.staging` com valores reais.
#   3. Executar: bash scripts/load_env.sh staging
#   4. Executar: bash scripts/check_secrets_hml.sh
#   5. Subir: docker compose -f docker-compose.hml.yml up -d
#
# Contrato operacional:
#   - Arquivo standalone de homologação.
#   - Usa somente imagens prontas; não é arquivo de build local.
#   - Não usa bind mount de código-fonte; apenas volumes de dados.
#   - Sobe o conjunto fechado de serviços, sem profiles.
#   - A exposição externa deve ocorrer apenas pelo Nginx.
#   - Os `env_file` consomem apenas os ativos sem sufixo gerados por `scripts/load_env.sh staging`.
#   - Precedência no runtime: `.env.common` -> `.env` específico do serviço -> variáveis declaradas em `environment`.

services:

  # --- Infraestrutura: banco de dados ---
  db:
    image: postgres:15
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketalert"]
      interval: 15s
      timeout: 5s
      retries: 3
    # Porta 5432 NÃO exposta — acesso apenas pela rede interna
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoring-net

  # --- Infraestrutura: Redis ---
  redis:
    image: redis:7
    env_file:
      - .env.common
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --maxmemory 512mb \
          --maxmemory-policy noeviction \
          --save "900 1" \
          --save "300 10" \
          --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
    # Porta 6379 NÃO exposta — acesso apenas pela rede interna
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - monitoring-net

  # --- Infraestrutura: carrega script Lua no Redis ---
  redis-init:
    image: redis:7
    env_file:
      - .env.common
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        set -e
        echo "redis-init: aguardando redis..."
        timeout=60; t=0
        until redis-cli -h redis -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG; do
          sleep 1; t=$$((t+1))
          if [ "$$t" -ge "$${timeout}" ]; then
            echo "redis-init: timeout" >&2; exit 1
          fi
        done
        SCRIPT='local key=KEYS[1];local now_ms=tonumber(ARGV[1]);local window_ms=tonumber(ARGV[2]);local limit=tonumber(ARGV[3]);local window_start=now_ms-window_ms;redis.call("ZREMRANGEBYSCORE",key,0,window_start);redis.call("ZADD",key,now_ms,now_ms);local count=tonumber(redis.call("ZCARD",key));local window_sec=math.floor(window_ms/1000)+1;redis.call("EXPIRE",key,window_sec);if count<=limit then return 1 else return 0 end'
        redis-cli -h redis -a "$$REDIS_PASSWORD" SCRIPT LOAD "$$SCRIPT"
        echo "redis-init: script carregado com sucesso"
    restart: "no"
    networks:
      - monitoring-net

  # --- Migrações Alembic ---
  migrations:
    image: market-suite/market_alert:latest
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/market_alert
    working_dir: /market_alert
    command:
      - alembic
      - "-c"
      - "alembic.ini"
      - "upgrade"
      - "head"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - monitoring-net

  # --- Temporal: banco dedicado ---
  temporal-db:
    image: postgres:15
    env_file:
      - ./.env.temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - monitoring-net

  # --- Temporal server ---
  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      - DB=postgres12
    env_file:
      - ./.env.temporal
    # Porta 7233 NÃO exposta — acesso apenas pela rede interna
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - monitoring-net

  # --- Temporal: prober de conectividade ---
  temporal-prober:
    image: alpine:3.18
    depends_on:
      temporal:
        condition: service_started
    command:
      - sh
      - -c
      - |
        apk add --no-cache netcat-openbsd >/dev/null 2>&1 || true
        echo "temporal-prober: aguardando temporal:7233..."
        timeout=120; t=0
        until nc -z temporal 7233 2>/dev/null; do
          sleep 1; t=$$((t+1))
          if [ $$t -ge $$timeout ]; then echo "temporal-prober: timeout" >&2; exit 1; fi
        done
        echo "temporal-prober: pronto"
    restart: "no"
    networks:
      - monitoring-net

  # --- API principal ---
  market_alert:
    image: market-suite/market_alert:latest
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/market_alert
    command:
      - uvicorn
      - "market_alert.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # --- Orquestrador Temporal ---
  market_orchestrator:
    image: market-suite/market_orchestrator:latest
    env_file:
      - .env.common
      - ./backend/market_orchestrator/.env.market_orchestrator
    environment:
      - PYTHONPATH=/backend
    command: ["python", "-m", "market_orchestrator.worker"]
    healthcheck:
      test: ["CMD", "python", "-c",
        "import asyncio; from temporalio.client import Client; asyncio.run(Client.connect('temporal:7233', namespace='default'))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      temporal-db:
        condition: service_healthy
      temporal-prober:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - monitoring-net

  # --- Microserviço de scraping ---
  market_scraper:
    image: market-suite/market_scraper:latest
    env_file:
      - .env.common
      - ./backend/market_scraper/.env.market_scraper
    environment:
      - ENV_FILE=.env.market_scraper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_OPERATIONAL_DB=2
      - PYTHONPATH=/app
    command:
      - uvicorn
      - "market_scraper.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.3'
          memory: 384M

  # --- Celery worker: scraping ---
  celery-worker-scraping:
    image: market-suite/market_alert:latest
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/market_alert
    command:
      - celery
      - "-A"
      - "market_alert.infrastructure.celery.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=10"
      - "-Q"
      - "celery,scraping"
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # --- Celery worker: comparação de preços ---
  celery-worker-compare:
    image: market-suite/market_alert:latest
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/market_alert
    command:
      - celery
      - "-A"
      - "market_alert.infrastructure.celery.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=4"
      - "-Q"
      - "compare"
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          cpus: '0.4'
          memory: 256M

  # --- Celery worker: notificações ---
  celery-worker-notifications:
    image: market-suite/market_alert:latest
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/market_alert
    command:
      - celery
      - "-A"
      - "market_alert.infrastructure.celery.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=4"
      - "-Q"
      - "notifications"
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 192M

  # --- Frontend (estático, build de produção) ---
  # Imagem deve ser construída com: --target production --build-arg VITE_API_URL=https://api-hml.seudominio.com
  frontend:
    image: market-suite/frontend:latest
    expose:
      - "5173"
    restart: unless-stopped
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # --- Proxy reverso Nginx (entrada pública HTTPS) ---
  # Requer: ./nginx/nginx.hml.conf e ./certs/hml.{crt,key} presentes na VPS
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.hml.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && wget --no-check-certificate --header='Host: api-hml.seudominio.com' -qO- https://127.0.0.1/health >/dev/null && wget --no-check-certificate --header='Host: app-hml.seudominio.com' -qO- https://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      market_alert:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - monitoring-net


volumes:
  db-data:
  redis-data:
  temporal-db-data:

networks:
  monitoring-net:
    driver: bridge
