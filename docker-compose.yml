services:

  #Banco de dados PostgreSQL utilizado pela aplicação
  db:
    image: postgres:15
    profiles:
      - infra
      - api
      - scraper
      - workers
    env_file:
      - .env.common
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketalert"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - monitoring-net


  #Instância Redis utilizada para cache e filas
  redis:
    image: redis:7
    profiles:
      - infra
      - api
      - scraper
      - workers
    env_file:
      - .env.common
    command:
      - sh
      - -c
      - |
        exec redis-server \
          --requirepass "$$REDIS_PASSWORD" \
          --maxmemory 512mb \
          --maxmemory-policy noeviction \
          --save "900 1" \
          --save "300 10" \
          --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "6379:6379"
    volumes:
      - ./backend/shared/infra/redis-scripts:/etc/redis/scripts:ro
      - redis-data:/data
    restart: unless-stopped
    networks:
      - monitoring-net


  #Carrega scripts lua no Redis na inicialização
  redis-init:
    image: redis:7
    profiles:
      - infra
      - api
      - scraper
      - workers
    env_file:
      - .env.common
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        export REDISCLI_AUTH="$$REDIS_PASSWORD";
        until redis-cli -h redis ping | grep -q PONG; do sleep 1; done;
        redis-cli -h redis SCRIPT LOAD "$(cat /etc/redis/scripts/sliding_window.lua)"
    volumes:
      - ./backend/shared/infra/redis-scripts:/etc/redis/scripts:ro
    restart: on-failure
    networks:
      - monitoring-net


#Executa migrações de banco de dados com Alembic (perfil infra)
  migrations:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    profiles:
      - infra
      - api
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/backend
    volumes:
      - ./backend/market_alert:/market_alert
      - ./backend:/backend:ro   
    working_dir: /market_alert
    command:
      - alembic
      - "-c"
      - "alembic.ini"
      - "upgrade"
      - "head"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - monitoring-net


#API principal do MarketAlert
  market_alert:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    profiles:
      - api
      - ui
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/backend
    command:
      - uvicorn
      - "main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - ./backend:/backend:ro   
    restart: unless-stopped
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M


  #Serviço dedicado ao scraping de produtos
  market_scraper:
    build:
      context: ./backend/market_scraper
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    profiles:
      - scraper
    env_file:
      - ./backend/market_scraper/.env.market_scraper
    environment:
      - ENV_FILE=.env.market_scraper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_OPERATIONAL_DB=2
      - PYTHONPATH=/app
    command:
      - uvicorn
      - "market_scraper.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_scraper:/app/market_scraper
      - ./backend/shared:/app/shared:ro
      - ./backend:/backend:ro
    restart: unless-stopped
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 768M
        reservations:
          cpus: '0.3'
          memory: 384M


  #Worker do Celery para tarefas assíncronas gerais (scraping)
  celery-worker-scraping:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    profiles:
      - workers
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/backend
    command:
      - celery
      - "-A"
      - "market_alert.infraestructure.celery.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=10"
      - "-Q"
      - "celery,scraping"
    user:
      "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - ./backend:/backend:ro   
    restart: on-failure
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M


  #Worker do Celery dedicado às comparações de preço (fila compare)
  celery-worker-compare:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    profiles:
      - workers
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/backend
    command:
      - celery
      - "-A"
      - "market_alert.infraestructure.celery.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=4"
      - "-Q"
      - "compare"
    user:
      "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - ./backend:/backend:ro
    restart: on-failure
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          cpus: '0.4'
          memory: 256M


  #Worker do Celery dedicado ao envio de notificações
  celery-worker-notifications:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
      additional_contexts:
        root: .
    profiles:
      - workers
    env_file:
      - .env.common
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/backend
    command:
      - celery
      - "-A"
      - "market_alert.infraestructure.celery.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=4"
      - "-Q"
      - "notifications"
    user:
      "1000:1000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - ./backend:/backend:ro
    restart: on-failure
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 192M


  #Interface web do MarketAlert executada com Vite para testes locais rápidos.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    profiles:
      - ui
    environment:
      - VITE_API_URL=http://localhost:8000
      - FRONTEND_PORT=5173
    command: pnpm exec vite --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      market_alert:
        condition: service_healthy
    networks:
      - monitoring-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M


  #Banco PostgreSQL exclusivo para persistência do Temporal (separado do banco de negócio)
  temporal-db:
    image: postgres:15
    profiles:
      - temporal
    env_file:
      - ./backend/market_orchestrator/.env.market_orchestrator
    environment:
      - POSTGRES_USER=${TEMPORAL_DB_USER}
      - POSTGRES_PASSWORD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_DB=temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER} -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    networks:
      - monitoring-net


  #Servidor Temporal (orquestrador de workflows duráveis)
  temporal:
    image: temporalio/auto-setup:1.25
    profiles:
      - temporal
    env_file:
      - ./backend/market_orchestrator/.env.market_orchestrator
    environment:
      - DB=postgres12
      - DB_PORT=${TEMPORAL_DB_PORT}
      - POSTGRES_SEEDS=${TEMPORAL_DB_HOST}
      - POSTGRES_USER=${TEMPORAL_DB_USER}
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - DEFAULT_NAMESPACE=${TEMPORAL_NAMESPACE}
    ports:
      - "7233:7233"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring-net


  #Interface web do Temporal para visualização de workflows
  temporal-ui:
    image: temporalio/ui:2.31
    profiles:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8080
    ports:
      - "8088:8080"
    depends_on:
      - temporal
    networks:
      - monitoring-net


volumes:
  db-data:
  redis-data:
  audit-logs:
  frontend-node-modules:
  frontend-pnpm-store:
  temporal-db-data:

networks:
  monitoring-net:
    driver: bridge
