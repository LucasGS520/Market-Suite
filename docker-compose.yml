services:

  #Banco de dados PostgreSQL utilizado pela aplicação
  db:
    image: postgres:15
    env_file:
      - .env.common
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketalert"]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - monitoring-net


  #Instância Redis utilizada para cache e filas
  redis:
    image: redis:7
    env_file:
      - .env.common
    command:
      - sh
      - -c
      - |
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly no --save ""
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - ./shared/infra/redis-scripts:/etc/redis/scripts:ro
    restart: unless-stopped
    networks:
      - monitoring-net


  #Carrega scripts lua no Redis na inicialização
  redis-init:
    image: redis:7
    env_file:
      - .env.common
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        export REDISCLI_AUTH="$$REDIS_PASSWORD";
        until redis-cli -h redis ping | grep -q PONG; do sleep 1; done;
        redis-cli -h redis SCRIPT LOAD "$(cat /etc/redis/scripts/sliding_window.lua)"
    volumes:
      - ./shared/infra/redis-scripts:/etc/redis/scripts:ro
    restart: on-failure
    networks:
      - monitoring-net


  #Executa migrações de banco de dados com Alembic
  migrations:
    build:
      context: ./market_alert
      dockerfile: Dockerfile
    env_file:
      - ./market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
    volumes:
      - ./market_alert:/market_alert
      - ./shared/infra:/market_alert/infra
    working_dir: /market_alert
    command:
      - alembic
      - "-c"
      - "alembic.ini"
      - "upgrade"
      - "head"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring-net


  #API principal do MarketAlert
  api:
    build:
      context: ./market_alert
      dockerfile: Dockerfile
    env_file:
      - ./market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
    command:
      - uvicorn
      - "main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./shared/infra:/market_alert/infra
    networks:
      - monitoring-net


  #Agendador de tarefas do Celery
  celery_beat:
    build:
      context: ./market_alert
      dockerfile: Dockerfile
    env_file:
      - ./market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
    command:
      - python
      - "beat_with_metrics.py"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./shared/infra:/market_alert/infra
    networks:
      - monitoring-net


  #Worker do Celery para tarefas assíncronas
  celery-worker:
    build:
      context: ./market_alert
      dockerfile: Dockerfile
    env_file:
      - ./market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
    command:
      - celery
      - "-A"
      - "market_alert.core.celery_app:celery_app"
      - "worker"
      - "--loglevel=debug"
      - "--pool=threads"
      - "--concurrency=4"
      - "-Q"
      - "celery,scraping,monitor"
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./shared/infra:/market_alert/infra
    networks:
      - monitoring-net


  #Serviço dedicado ao scraping de produtos
  market_scraper:
    build:
      context: ./market_scraper
      dockerfile: Dockerfile
    env_file:
      - ./market_scraper/.env.market_scraper
    environment:
      - ENV_FILE=.env.market_scraper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command:
      - uvicorn
      - "market_scraper.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./market_scraper:/app/market_scraper
      - ./shared/infra:/market_scraper/infra
      - ./shared:/app/shared
    networks:
      - monitoring-net


  #Servidor Prometheus para coleta de métricas
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./shared/infra/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-net


  #Gerenciador de alertas do Prometheus
  alertmanager:
    build:
      context: ./shared/infra/alertmanager
      dockerfile: Dockerfile
    image: alertmanager-envsubst
    volumes:
      - ./shared/infra/alertmanager:/etc/alertmanager:ro
    env_file:
      - .env.common
    ports:
      - "9093:9093"
    networks:
      - monitoring-net


  #Armazenamento centralizado de logs com Loki
  loki:
    image: grafana/loki:2.9.8
    user: root
    entrypoint:
      - sh
      - -c
      - |
        chown -R root:root /tmp/loki && \
        exec /usr/bin/loki -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./shared/infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/tmp/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring-net


  #Agente Promtail que envia logs para o Loki
  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./shared/infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/log:/var/log:ro
    networks:
      - monitoring-net


  #Exportador de métricas do host
  node-exporter:
    image: prom/node-exporter:latest
    pid: host
    volumes:
      - /:/host:ro
    command:
      - '--path.rootfs=/host'
    networks:
      - monitoring-net


  #Exportador de métricas de containers Docker
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoring-net


  #Interface do Grafana para visualização de métricas
  grafana:
    image: grafana/grafana:latest
    env_file:
      - .env.common
    volumes:
      - ./shared/infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-storage:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring-net


  #Ferramenta de teste de carga Locust
  locust:
    image: locustio/locust
    depends_on:
      - api
    volumes:
      - ./market_alert:/market_alert
      - ./shared/infra:/market_alert/infra
    working_dir: /market_alert
    command:
      - "-f"
      - "tests/load/locustfile.py"
      - "--host"
      - "http://api:8000"
    ports:
      - "8089:8089"
    networks:
      - monitoring-net


volumes:
  db-data:
  grafana-storage:
  audit-logs:
  loki-data:

networks:
  monitoring-net:
    driver: bridge
