services:

  #Banco de dados PostgreSQL utilizado pela aplicação
  db:
    image: postgres:15
    env_file:
      - .env.common
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketalert"]
      interval: 10s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - monitoring-net


  #Executa migrações de banco de dados com Alembic
  migrations:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
    env_file:
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/
    volumes:
      - ./backend/market_alert:/market_alert
      # Monta o pacote `shared` inteiro para que imports como `import shared` funcionem
      - ./backend/shared:/market_alert/shared:ro
      - ./backend/shared/infra:/market_alert/infra
      - ./backend:/backend:ro   
    working_dir: /market_alert
    command:
      - alembic
      - "-c"
      - "alembic.ini"
      - "upgrade"
      - "head"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - monitoring-net


  #Instância Redis utilizada para cache e filas
  redis:
    image: redis:7
    env_file:
      - .env.common
    command:
      - sh
      - -c
      - |
        exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --save "900 1 300 10 60 10000"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - ./backend/shared/infra/redis-scripts:/etc/redis/scripts:ro
      - redis-data:/data
    restart: unless-stopped
    networks:
      - monitoring-net


  #Carrega scripts lua no Redis na inicialização
  redis-init:
    image: redis:7
    env_file:
      - .env.common
    depends_on:
      redis:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        export REDISCLI_AUTH="$$REDIS_PASSWORD";
        until redis-cli -h redis ping | grep -q PONG; do sleep 1; done;
        redis-cli -h redis SCRIPT LOAD "$(cat /etc/redis/scripts/sliding_window.lua)"
    volumes:
      - ./backend/shared/infra/redis-scripts:/etc/redis/scripts:ro
    restart: on-failure
    networks:
      - monitoring-net


  #API principal do MarketAlert
  market_alert:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
    env_file:
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/
    command:
      - uvicorn
      - "main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./backend/shared/infra:/market_alert/infra
      - ./backend/shared:/market_alert/shared:ro
      - ./backend:/backend:ro   
    networks:
      - monitoring-net


  #Worker do Celery para tarefas assíncronas gerais (scraping)
  celery-worker-scraping:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
    env_file:
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/
    command:
      - celery
      - "-A"
      - "market_alert.core.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=4"
      - "-Q"
      - "celery,scraping"
    user: 
      "1000:1000"
    ports:
      - "8002:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./backend/shared/infra:/market_alert/infra
      - ./backend/shared:/market_alert/shared:ro
      - ./backend:/backend:ro   
    networks:
      - monitoring-net


  #Worker do Celery dedicado ao coletor contínuo (fila monitor)
  celery-worker-monitor:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
    env_file:
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/
      - CONTINUOUS_COLLECTOR_AUTOSTART=1
      - CONTINUOUS_COLLECTOR_AUTOSTART_TTL=60
    command:
      - celery
      - "-A"
      - "market_alert.core.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=1"
      - "-Q"
      - "monitor"
    user:
      "1000:1000"
    ports:
      - "8004:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./backend/shared/infra:/market_alert/infra
      - ./backend/shared:/market_alert/shared:ro
      - ./backend:/backend:ro
    networks:
      - monitoring-net

  #Worker do Celery dedicado às comparações de preço (fila compare)
  celery-worker-compare:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
    env_file:
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/
    command:
      - celery
      - "-A"
      - "market_alert.core.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=2"
      - "-Q"
      - "compare"
    user:
      "1000:1000"
    ports:
      - "8005:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./backend/shared/infra:/market_alert/infra
      - ./backend/shared:/market_alert/shared:ro
      - ./backend:/backend:ro
    networks:
      - monitoring-net

  #Worker do Celery dedicado ao envio de notificações
  celery-worker-notifications:
    build:
      context: ./backend/market_alert
      dockerfile: Dockerfile
    env_file:
      - ./backend/market_alert/.env.market_alert
    environment:
      - ENV_FILE=.env.market_alert
      - PYTHONPATH=/
    command:
      - celery
      - "-A"
      - "market_alert.core.celery_app:celery_app"
      - "worker"
      - "--loglevel=info"
      - "--pool=prefork"
      - "--concurrency=2"
      - "-Q"
      - "notifications"
    user:
      "1000:1000"
    ports:
      - "8003:8002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_alert:/market_alert
      - audit-logs:/market_alert/logs/audit
      - ./backend/shared/infra:/market_alert/infra
      - ./backend/shared:/market_alert/shared:ro
      - ./backend:/backend:ro
    networks:
      - monitoring-net

  #Serviço dedicado ao scraping de produtos
  market_scraper:
    build:
      context: ./backend/market_scraper
      dockerfile: Dockerfile
    env_file:
      - ./backend/market_scraper/.env.market_scraper
    environment:
      - ENV_FILE=.env.market_scraper
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app:/
    command:
      - uvicorn
      - "market_scraper.main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/market_scraper:/app/market_scraper
      - ./backend/shared:/app/shared:ro
      - ./backend:/backend:ro
    networks:
      - monitoring-net

  #Interface web do MarketAlert executada com Vite para testes locais rápidos.
  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:8000
      - FRONTEND_PORT=5173
    entrypoint:
      - sh
      - -c
      - |
        corepack enable && \
        corepack prepare pnpm@10.4.1 --activate && \
        pnpm install --frozen-lockfile=false && \
        pnpm exec vite --host 0.0.0.0 --port "$${FRONTEND_PORT}"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      market_alert:
        condition: service_started
    networks:
      - monitoring-net

volumes:
  db-data:
  redis-data:
  audit-logs:
  frontend-node-modules:
  frontend-pnpm-store:

networks:
  monitoring-net:
    driver: bridge
