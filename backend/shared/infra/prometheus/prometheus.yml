global:
  scrape_interval: 15s #A cada 15 segundos, coleta métricas
  
scrape_configs:
  #Fastapi (principal)
  - job_name: marketalert_app
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  #Audit Exporter (arquivos de auditoria)
  - job_name: marketalert_audit
    metrics_path: /audit/metrica
    static_configs:
        - targets: ["api:8000"]

  #Celery worker
  - job_name: marketalert_worker
    metrics_path: /metrics
    static_configs:
      - targets: ["celery-worker-scraping:8002"]

  #Worker dedicado ao coletar contínuo
  - job_name: marketalert_worker_monitor
    metrics_path: /metrics
    static_configs:
      - targets: ["celery-worker-monitor:8002"]

  - job_name: node_exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
