groups:
  - name: scraping_alerts
    rules:
      #Alerta quando P95 de latência de scraping excede o limite operacional de 20s
      - alert: HighScrapingLatencyP95
        expr: histogram_quantile(0.95, sum(rate(scraping_latency_seconds_bucket[5m])) by (le)) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latência P95 de scraping acima de 20s"
          description: >
            O tempo de processamento do scraper está acima da meta operacional (20s no P95)
            há pelo menos 10 minutos. Investigue gargalos na etapa de busca ou parsers.

      #Alerta quando o volume de coletas sem resultado cresce de forma anormal
      - alert: ScraperNoResultSpike
        expr: increase(scraper_no_result_total[15m]) > 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Aumento atípico de respostas sem resultado"
          description: >
            O contador scraper_no_result_total aumentou mais de 15 vezes nos últimos 15 minutos.
            Pode indicar mudanças na página alvo ou falhas de parsing que exigem revisão.
