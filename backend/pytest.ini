[pytest]
minversion = 7.4
testpaths =
    market_alert/tests
    market_orchestrator/tests
    market_scraper/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-config
    --strict-markers
    -p no:cacheprovider
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
norecursedirs =
    .git
    .pytest_cache
    __pycache__
    alembic
markers =
    unit: testes unitarios isolados com mocks, fakes ou dependencias em memoria.
    integration: testes de contrato e fluxo com infraestrutura controlada.
    integration_high_cost: subconjunto de integracao com dependencias lentas ou workflows longos.
    stress: testes tecnicos de carga, tempo limite ou concorrencia controlada.
