[pytest]
#Configurações de testes para o módulo market_scraper
#Ignora benchmarks lentos por padrão e reduz o tempo gasto pelo pytest-benchmark
addopts = -m "not slow" --benchmark-min-time=0.01 --benchmark-min-rounds=1
markers =
    integration: mark a test as requiring integration resources
    slow: testes de benchmark que são mais demorados
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
pythonpath = .
