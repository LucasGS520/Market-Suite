#Arquivo central de configurações de scraping

#Mapeia as etapas disponíveis para o ``SynergicPipeline``.
pipeline_steps:
  extruct: ExtructExtractionStep
  parsel: ParselExtractionStep
  beautifulsoup: BeautifulSoupExtractionStep
  requestshtml: RequestsHTMLRenderStep
  selectorlib: SelectorLibExtractionStep
  mechanical_soup_login: MechanicalSoupLoginStep

#Configura argumentos padrão das etapas (ex.: timeouts) por domínio e contexto
pipeline_step_options:
  default:
    default:
      requestshtml:
        timeout: 8
      mechanical_soup_login:
        timeout: 10
      extruct:
        timeout: 8
  example.com:
    default:
      requestshtml:
        timeout: 12
      mechanical_soup_login:
        timeout: 15

#Define, por domínio, a sequência de etapas a ser utilizada
pipeline_policies:
  mercadolivre.com.br:
    default: &mercadolivre_pipeline
      - extruct
      - parsel
      - beautifulsoup
      - requestshtml
      - selectorlib
      - mechanical_soup_login
    competitor: *mercadolivre_pipeline

  amazon.com.br:
    default: &amazon_pipeline
      - extruct
      - parsel
      - beautifulsoup
      - requestshtml
      - selectorlib
      - mechanical_soup_login
    competitor: *amazon_pipeline

  magazineluiza.com.br:
    default: &magazineluiza_pipeline
      - extruct
      - parsel
      - beautifulsoup
      - requestshtml
      - selectorlib
      - mechanical_soup_login
    competitor: *magazineluiza_pipeline

  example.com:
    default: &example_pipeline
      - selectorlib
      - parsel
      - beautifulsoup
      - requestshtml
      - extruct
      - mechanical_soup_login
    competitor: *example_pipeline

#Define o modo de execução do pipeline sinérgico por domínio; Domínios não listados utilizam ``sequential`` como padrão
pipeline_execution:
  default:
    default: sequential
    competitor: sequential
  mercadolivre.com.br:
    default: sequential
    competitor: conditional
  amazon.com.br:
    default: parallel
    competitor: parallel
  magazineluiza.com.br:
    default: conditional
    competitor: conditional
  example.com:
    default: parallel
    competitor: sequential

#Define limites de requisições por domínio (max_requests por janela)
rate_limits:
  default:
    max_requests: 60
    window: 60
  mercadolivre.com.br:
    max_requests: 120
    window: 60
  amazon.com.br:
    max_requests: 90
    window: 60
  magazineluiza.com.br:
    max_requests: 80
    window: 60
    
#Controla progressivamente o rollout de funcionalidades críticas
feature_flags:
  synergic_pipeline:
    default:
      default:
        enabled: true
        rollout_percentage: 100
      competitor:
        enabled: true
        rollout_percentage: 100
    mercadolivre.com.br:
      default:
        enabled: true
        rollout_percentage: 100
      competitor:
        enabled: true
        rollout_percentage: 100
    amazon.com.br:
      default:
        enabled: true
        rollout_percentage: 100
      competitor:
        enabled: true
        rollout_percentage: 100
    magazineluiza.com.br:
      default:
        enabled: true
        rollout_percentage: 100
      competitor:
        enabled: true
        rollout_percentage: 100
    example.com:
      default:
        enabled: true
        rollout_percentage: 100
      competitor:
        enabled: true
        rollout_percentage: 100
        