#Arquivo central de configurações de scraping
#Os parsers puros ficam em ``market_scraper/parsers`` e são orquestrados pelas classes abaixo

strategies:
  JSON_ML: MercadoLivreJsonStrategy
  JSON_AMAZON: AmazonJsonStrategy
  JSON_MAGALU: MagaluJsonStrategy
  HTML_ML: MercadoLivreHtmlStaticStrategy
  HTML_AMAZON: AmazonHtmlStaticStrategy
  HTML_MAGALU: MagaluHtmlStaticStrategy

#Para cada domínio, lista as estratégias na ordem de prioridade
policies:
  mercadolivre.com.br:
    default:
      - JSON_ML
      - HTML_ML
    competitor:
      - HTML_ML
  amazon.com.br:
    default:
      - JSON_AMAZON
      - HTML_AMAZON
    competitor:
      - HTML_AMAZON
  magazineluiza.com.br:
    default:
      - JSON_MAGALU
      - HTML_MAGALU
    competitor:
      - HTML_MAGALU

#Define o modo de execução das estratégias por domínio; Quando não especificado o modo ``sequential`` é utilizado
strategy_execution:
  default:
    default: sequential
    competitor: sequential
  mercadolivre.com.br:
    default: conditional
    competitor: sequential
  amazon.com.br:
    default: parallel
    competitor: parallel
  magazineluiza.com.br:
    default: sequential
    competitor: conditional

#Mapeia as etapas disponíveis para o ``SynergicPipeline``.
pipeline_steps:
  mechanical_soup_login: MechanicalSoupLoginStep
  extruct: ExtructExtractionStep
  parsel: ParselExtractionStep
  beautifulsoup: BeautifulSoupExtractionStep
  requestshtml: RequestsHTMLRenderStep
  selectorlib: SelectorLibExtractionStep
  

#Define, por domínio, a sequência de etapas a ser utilizada
pipeline_policies:
  mercadolivre.com.br:
    default:
      - extruct
      - parsel
      - beautifulsoup
      - requestshtml
      - selectorlib
      - mechanical_soup_login

  amazon.com.br:
    default:
      - extruct
      - parsel
      - beautifulsoup
      - requestshtml
      - selectorlib
      - mechanical_soup_login

  magazineluiza.com.br:
    default:
      - extruct
      - parsel
      - beautifulsoup
      - requestshtml
      - selectorlib
      - mechanical_soup_login

  example.com:
    default:
      - selectorlib
      - parsel
      - beautifulsoup
      - requestshtml
      - extruct
      - mechanical_soup_login

#Define o modo de execução do pipeline sinégico por domínio; Domínios não listados utilizam ``sequential`` como padrão
pipeline_execution:
  default:
    default: sequential
  mercadolivre.com.br:
    default: sequential
    competitor: conditional
  amazon.com.br:
    default: parallel
  magazineluiza.com.br:
    default: conditional
  example.com:
    default: parallel

#Define limites de requisições por domínio (max_requests por janela)
rate_limits:
  default:
    max_requests: 60
    window: 60
  mercadolivre.com.br:
    max_requests: 120
    window: 60
  amazon.com.br:
    max_requests: 90
    window: 60
  magazineluiza.com.br:
    max_requests: 80
    window: 60
    
#Controla progressivamente o rollout de funcionalidades críticas
feature_flags:
  synergic_pipeline:
    default:
      default:
        enabled: true
        rollout_percentage: 100
      competitor:
        enabled: true
        rollout_percentage: 100
    mercadolivre.com.br:
      default:
        enabled: true
        rollout_percentage: 100
      competitor:
        enabled: true
        rollout_percentage: 100
    amazon.com.br:
      default:
        enabled: true
        rollout_percentage: 100
    magazineluiza.com.br:
      default:
        enabled: true
        rollout_percentage: 100
    example.com:
      default:
        enabled: true
        rollout_percentage: 100
        